[package]
name = "bot-roles"
version = "3.4.0"
edition = "2024"
rust-version = "1.94"
description = "Bot Discord de gestion des rôles auto-assignables"
license = "MIT"

[dependencies]
poise = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
# `macros` fournit `sqlx::migrate!`, qui embarque les fichiers SQL dans le
# binaire — indispensable pour une image `scratch` sans répertoire migrations.
# Les requêtes restent en API dynamique (`query_as`), donc aucun `DATABASE_URL`
# n'est nécessaire à la compilation ni en CI.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "derive",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dotenvy = "0.15"
# Le contenu du forum est rédigé dans un fichier TOML versionné, relu comme un
# texte et importé en pièce jointe.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
# Les champs des builders serenity sont privés : les tests d'embed vérifient la
# charge utile réellement envoyée à Discord, via sa sérialisation.
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
