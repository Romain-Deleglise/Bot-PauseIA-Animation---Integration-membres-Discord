# Deux étapes : on vérifie à chaque proposition de fusion, on publie sur tag.
#
# Le déploiement ne fait pas partie du pipeline : la production tourne sur un
# VPS avec Docker seul, qui tire l'image publiée ici (voir README).

# Un pipeline ne part que pour ce qui compte : une proposition de fusion, la
# branche par défaut, ou un tag. Sans cette barrière, chaque branche poussée —
# y compris celles reprises d'un ancien dépôt — déclenche une compilation Rust
# complète, qui prend plusieurs minutes à froid.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - build
  - pages

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always

# Le cache couvre les sources téléchargées et les artefacts de compilation.
# Indexé par branche, avec repli sur celui de la branche par défaut : une MR
# qui démarre repart de la dernière compilation de `main` au lieu de zéro.
.rust_cache: &rust_cache
  cache:
    - key: "rust-$CI_COMMIT_REF_SLUG"
      fallback_keys:
        - "rust-$CI_DEFAULT_BRANCH"
      paths:
        - .cargo/registry/index
        - .cargo/registry/cache
        - target/

# Pas sur les tags : un tag pointe sur un commit déjà vérifié sur sa branche,
# et refaire la compilation coûterait plusieurs minutes pour rien.
check:
  stage: check
  image: rust:1.95-alpine
  interruptible: true
  <<: *rust_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache musl-dev
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --check
    - cargo clippy --all-targets --locked -- -D warnings
    - cargo test --locked

build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  # Uniquement sur tag : une image publiée correspond toujours à une version
  # nommée, ce qui rend le retour arrière trivial.
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    # Le nom complet est repris tel quel dans docker-compose.yml sur le VPS.
    - docker image inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" --format 'Image publiée {{index .RepoTags 0}}, {{.Size}} octets'

# Éditeur du fichier de contenu, publié sur GitLab Pages.
#
# Page statique sans serveur : elle lit un `forum.toml`, le donne à remplir avec
# un aperçu des cartes, et le réexporte. Rien n'est enregistré en ligne, et elle
# ne parle pas à Discord — le fichier obtenu se dépose dans `/forum importer`.
#
# **Seule la page est publiée, jamais `contenu/forum.toml`.** Celui-ci nomme les
# référents de chaque projet et les villes de chaque groupe local : le déposer à
# côté d'une page consultable exposerait ces informations à qui a l'URL. La page
# démarre donc vide, et l'on y importe son fichier depuis son poste.
pages:
  stage: pages
  image: alpine:3
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public
    - cp web/index.html public/index.html
  artifacts:
    paths:
      - public
