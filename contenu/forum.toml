[[fils]]
# Équipes
salon        = "1548365691038732368"
confirmations = true
couleur      = "#9B51E0"
role_parent  = "portail-équipe"
salon_notifications = "1408569062241603614"
description  = "Les équipes sont le cœur opérationnel de Pause IA (engagement plus soutenu, ~5 h/semaine). On y entre après un court parcours d'intégration. Lève la main 🙋 sur une équipe pour le démarrer : tu recevras un message privé avec les prochaines étapes et le lien pour un échange d'accueil."
mp           = """
Salut 👋

Bienvenue sur le serveur de Pause IA ! ⏸️

Tu viens de lever la main sur une équipe : tu as reçu le rôle du parcours d'intégration des bénévoles actifs, celles et ceux qui contribuent chaque semaine à Pause IA.

Pour avancer, je t'encourage à réserver un créneau avec la directrice exécutive de Pause IA pour discuter de comment tu pourrais t'investir dans l'association : https://calendly.com/clemence-pauseia/30min 🙂

Pendant que tu attends ton créneau, tu peux prendre de l'avance sur le parcours d'intégration :

**1.** Lire le guide du candidat : https://pauseia.notion.site/devenir-benevole
**2.** Remplir le formulaire bénévole, décrit dans ce guide
**3.** Adhérer à l'association, demandé pour s'engager en équipe : https://www.helloasso.com/associations/pause-ia/adhesions/formulaire-d-adhesion-a-pause-ia
**4.** Te signaler dans le salon #portail

Rien de tout cela n'est obligatoire avant l'échange : viens comme tu es, on fera le point ensemble.

Notre charte des valeurs, si tu veux savoir ce qui nous tient à cœur : https://pauseia.fr/fr/charte-des-valeurs

Merci, et bienvenue à Pause IA ! 🌱 N'hésite pas à envoyer un message sur Discord si tu rencontres une difficulté ! 😊"""

