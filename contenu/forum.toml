[[fils]]
nom = "Équipes"
salon = "1548365691038732368"
couleur = "#9B51E0"
role_parent = "portail-équipe"
salon_notifications = "1408569062241603614"
confirmations = true
mp = """
Salut 👋

Tu viens de dire que tu voulais t'investir dans une équipe. Merci, et bienvenue !

Nous sommes en pleine structuration en ce moment. Nous ferons de notre mieux pour t'accueillir dans de bonnes conditions, mais sois indulgent·e si la réponse tarde un peu.

**Un point de franchise avant tout le reste.** Une équipe demande environ cinq heures par semaine pour que ça fonctionne, pour toi comme pour nous. Si tu n'es pas sûr·e de pouvoir les dégager en ce moment, va plutôt voir le fil **Projets** : des missions concrètes, sans engagement de durée. La porte des équipes restera ouverte.

**Si tu te lances, la prochaine étape est un échange de trente minutes** avec Clémence, notre directrice exécutive. Vous ferez connaissance et vous verrez ensemble où tu aurais le plus d'impact.

Réserve ton créneau ici : <https://calendly.com/clemence-pauseia/30min>

En attendant, deux choses à faire, et une à lire :

1. Adhérer à l'association, ce qui est demandé pour s'engager en équipe : <https://pauseia.fr/rejoindre>
2. Remplir le formulaire bénévole, décrit dans le guide du candidat : <https://pauseia.notion.site/devenir-benevole>
3. Lire notre charte des valeurs : <https://pauseia.fr/fr/charte-des-valeurs>

Une question ? Le salon #portail est fait pour ça, quelqu'un te répondra. 🌱

Si tu fais déjà partie d'une équipe, tu peux ignorer ce message."""

