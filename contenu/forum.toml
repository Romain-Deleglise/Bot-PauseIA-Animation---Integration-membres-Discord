# Contenu du forum PauseIA, transcrit du cahier des charges.
#
# `/forum importer` lit ce fichier, crée les rôles manquants, publie les cartes
# et met à jour celles qui existent déjà. Il est rejouable et ne supprime rien.
# Ensuite, c'est Discord qui fait foi.
#
# À COMPLÉTER AVANT LE PREMIER IMPORT
#   - `salon` : les quatre valeurs ci-dessous sont factices. Mettez les
#     identifiants des vrais fils (clic droit sur le fil > Copier l'identifiant).
#   - `illustration` : ajoutez une URL https par fil quand les visuels existent.
#   - `mp` : le message privé de bienvenue, si vous en voulez un.
#   - Les référents sont notés `@pseudo` comme dans le CDC. À l'import, le bot en fait une mention cliquable si la personne est membre du serveur, et signale les autres.
#
# ÉCARTS AVEC LE CDC
#   - Les descriptions de « Groupes locaux » et « Compétences » étaient
#     interverties dans le CDC : rétablies ici.
#   - Melun et Colmar n'avaient pas de titre : déduits du nom du rôle.
#   - Les marqueurs [Inactif], [En structuration], [À venir] et [Besoin d'aide]
#     sont conservés dans les titres, comme dans le CDC.
#   - Les deux groupes [Inactif] portent `couleur = "#99AAB5"`, qui grise leur
#     carte. Ce champ est facultatif et vaut pour n'importe quel message.

# ═══════════════════════════════════════════════════════════════════════════
[[fils]]
