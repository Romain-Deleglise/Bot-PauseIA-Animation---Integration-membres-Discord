[[fils.messages]]
slug    = "fresque-ia"
titre   = "Fresque de l'IA"
texte   = """
Référent : @doweee1

Notre version de la Fresque de l'IA, adaptée de celle du CeSIA et inspirée de la Fresque du climat : 36 cartes pour animer un atelier collaboratif où les participants apprennent et relient les sujets.
Il reste à créer les documents pour animateurs et une formation. Une fois déployé, le projet continuera de vivre grâce aux retours d'expérience et aux mises à jour.

Coordonné par l'équipe *communication*."""

[[fils.messages]]
slug    = "pauseaction"
titre   = "PauseAction"
texte   = """
Référent : @clemence_coqcinelle

Chaque semaine, nous trouvons une action simple, signer, partager ou commenter, réalisable en moins de cinq minutes, sur notre groupe WhatsApp.
Nous avons grandement besoin d'un nouveau référent pour ce projet!

Coordonné par l'équipe *communication*."""

[[fils.messages]]
slug    = "idees-recues"
titre   = "Idées reçues"
information = true
texte   = """
Référentes : @jeannebazard @lady_mircalla

Nous rassemblons les objections fréquentes, les idées reçues et les fausses promesses sur les apports et les dangers de l'IA, puis nous y répondons afin d'outiller le mouvement.

Coordonné par l'équipe *communication*."""

[[fils.messages]]
slug    = "entraide-plaidoyer"
titre   = "Entraide plaidoyer"
texte   = """
Référent : @zedioum

Porter la position de PauseIA auprès des institutions et des élus. Dans ce projet, vous aurez accès à des ressources et des formations pour participer au plaidoyer de l'association dans votre département.

Coordonné par l'équipe *plaidoyer* de l'association. Vous pouvez d'ailleurs rejoindre cette équipe si vous êtes très motivé."""

[[fils.messages]]
slug    = "onboarding"
titre   = "Accueil et orientation"
texte   = """
Référent : @gadow2_0

Accueillir les nouveaux membres sur le Discord et les orienter vers les projets et équipes qui leur correspondent.
On essaie de proposer des visios à chaque nouveau membre, et c'est très motivant et enrichissant !

Coordonné par le bureau."""

[[fils.messages]]
slug    = "animation-discord"
titre   = "[En structuration] Animation Discord"
texte   = """
Référent : @gyrodiot

Organiser et animer des ateliers, soirées de réflexion, discussions détente, lectures et soirées de soutien.

Ce groupe a pour vocation d'effectuer aussi une veille sur le bien-être et la santé mentale des membres (canal #soutien) et d'apporter des ressources spécifiques.

Toutes les autres idées sont bienvenues.

Coordonné par le bureau."""

[[fils.messages]]
slug    = "rencontres-pauseia"
titre   = "Organisation des rencontres PauseIA"
texte   = """
Référente : @clemence_coqcinelle

Rejoignez ce projet pour aider à organiser des rencontres entre membres de toute la France. Prochain objectif : week-end de rencontre et de formation de Pause IA.

Coordonné par le bureau."""

[[fils.messages]]
slug    = "partenariats-influenceurs"
titre   = "[En structuration] Partenariats avec des influenceurs"
texte   = """
Référent : @flavien0525

Identifier et solliciter des streamers et youtubeurs pour inviter Maxime Fournes sur leurs chaînes, mais aussi contacter d'autres types de profils influents pour organiser des rencontres.
"""

[[fils.messages]]
slug    = "illustration"
titre   = "[À venir] Illustration humaine (PauseIArt)"
texte   = """
Rejoignez ce projet si vous avez envie de produire des illustrations humaines pour les réseaux sociaux et la communication de Pause IA.
Cela comprend aussi la création de tracts, de visuels originaux pour les groupes locaux et même de goodies pour notre boutique.

Coordonné par l'équipe *communication*."""

[[fils.messages]]
slug    = "jeu-pauseia"
titre   = "[À venir] Jeu vidéo et jeu de rôle"
texte   = """
Référent : @dyson4282. Il a développé un jeu multijoueur super, n'hésitez pas à lui demander le lien.

Concevoir des jeux vidéo et jeux de rôle au service de la sensibilisation. Plusieurs personnes ont manifesté leur intérêt, mais tout reste à faire !"""

[[fils.messages]]
slug    = "relation-associations"
titre   = "[À venir] Relations associations"
texte   = """
Prendre contact avec différentes associations dont la mission est proche de celle de PauseIA. Leur présenter notre argumentaire, proposer différentes activités, et aussi surveiller leurs événements pour créer des liens."""


